<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyient Foundation – Reset Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--gray-50); }
    .login-wrapper { width:100%; max-width:400px; padding:20px; }
    .login-card { background:#FFF; border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:32px 28px; box-shadow:var(--shadow); }
    .login-header { text-align:center; margin-bottom:24px; }
    .login-header img { width:48px; height:48px; margin:0 auto 12px; border-radius:8px; display:block; }
    .login-header h1 { font-size:20px; font-weight:700; color:var(--gray-900); margin:0 0 4px; letter-spacing:-.01em; }
    .login-form { display:flex; flex-direction:column; gap:16px; }
    .login-actions { margin-top:8px; }
    .login-actions .btn { width:100%; height:42px; font-size:14px; justify-content:center; }
    .login-error { background:var(--danger-bg); color:var(--danger); font-size:13px; padding:10px 12px; border-radius:var(--radius); display:none; }
    .login-success { background:#DCFCE7; color:#166534; font-size:13px; padding:10px 12px; border-radius:var(--radius); display:none; }
    .password-wrapper { position:relative; display:flex; align-items:center; }
    .password-wrapper input { width:100%; padding-right:40px; box-sizing:border-box; }
    .password-toggle { position:absolute; right:10px; cursor:pointer; background:none; border:none; color:var(--gray-500); padding:0; display:flex; align-items:center; justify-content:center; outline:none; }
    .password-toggle:hover { color:var(--gray-700); }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Cyient Foundation" />
        <h1>Set New Password</h1>
      </div>

      <div class="login-error" id="err"></div>
      <div class="login-success" id="ok"></div>

      <form class="login-form" id="resetForm">
        <input type="hidden" id="token" value="{{ token }}" />
        <div class="field">
          <label for="new_password">New password</label>
          <div class="password-wrapper">
            <input type="password" id="new_password" placeholder="At least 4 characters" required />
            <button type="button" class="password-toggle" onclick="togglePassword('new_password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" placeholder="Re-enter new password" required />
            <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="login-actions">
          <button type="submit" class="btn btn-primary" id="reset-btn">Save New Password</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('.eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    const form = document.getElementById('resetForm');
    const errBox = document.getElementById('err');
    const okBox = document.getElementById('ok');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none'; okBox.style.display = 'none';
      const nw = document.getElementById('new_password').value;
      const cf = document.getElementById('confirm_password').value;
      if (nw !== cf) { errBox.textContent = 'Passwords do not match'; errBox.style.display = 'block'; return; }

      const btn = document.getElementById('reset-btn');
      btn.textContent = 'Saving...'; btn.disabled = true;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            token: document.getElementById('token').value,
            new_password: nw
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Reset failed');
        okBox.textContent = data.message || 'Password updated successfully. You can log in now.';
        okBox.style.display = 'block';
        setTimeout(() => { location.href = '/login'; }, 2000);
      } catch (err) {
        errBox.textContent = err.message; errBox.style.display = 'block';
        btn.textContent = 'Save New Password'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
